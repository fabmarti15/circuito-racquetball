<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Racquetball Chile · horarios y resultados</title>
<meta name="description" content="Horarios, resultados, llaves, jugadores y ranking del Circuito Nacional de Racquetball de Chile, en formato legible.">
<meta name="theme-color" content="#0B5D4E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..800;1,62..125,400..700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFBF9; --card:#FFFFFF; --ink:#14181C; --ink-2:#4A5560; --ink-3:#8A939C;
    --line:#E7E5DF; --green:#0B5D4E; --green-soft:#EAF3F0; --signal:#FF4A1C;
    --signal-soft:#FFF0EB; --radius:14px;
    --sans:'Archivo','Helvetica Neue',Helvetica,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-variation-settings:'wdth' 100; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:780px;margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom))}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:30;background:rgba(251,251,249,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .hd{max-width:780px;margin:0 auto;padding:11px 18px}
  .kicker{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:700}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--signal);animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  h1{margin:3px 0 2px;font-size:clamp(17px,4.6vw,23px);font-weight:800;font-variation-settings:'wdth' 112;letter-spacing:-.015em;line-height:1.14}
  .sub{font-size:12px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:3px 10px}
  .sub b{color:var(--ink-2);font-weight:600}
  #torneoSel{margin-top:7px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 8px;max-width:100%}

  /* ---------- tabbar ---------- */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs-in{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;border:0;background:none;color:var(--ink-3);font-size:10.5px;font-weight:700;letter-spacing:.02em;cursor:pointer}
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-current=true]{color:var(--green)}
  .tab[aria-current=true] svg{stroke-width:2.4}

  /* ---------- comunes ---------- */
  section{margin-top:24px}
  .h2{display:flex;align-items:baseline;gap:9px;margin:0 0 11px;padding-bottom:7px;border-bottom:2px solid var(--ink)}
  .h2 span{font-size:15px;font-weight:800;font-variation-settings:'wdth' 108;text-transform:uppercase}
  .h2 em{font-style:normal;font-size:12px;color:var(--ink-3);font-weight:600;margin-left:auto;text-align:right}
  input,select,button{font:inherit}
  input[type=search],select{width:100%;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  input[type=search]:focus,select:focus{outline:2px solid var(--green);outline-offset:1px;border-color:transparent}
  button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);padding:10px 13px;font-size:14px;font-weight:600}
  button.primary{background:var(--green);border-color:var(--green);color:#fff}
  button:active{transform:translateY(1px)}
  .row{display:flex;gap:8px}
  .empty{padding:18px 14px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--ink-3);font-size:14px;text-align:center}
  .note{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.5}
  .warn{background:#FFFBEB;border:1px solid #F4E4B8;color:#7A5A00;padding:11px 13px;border-radius:12px;font-size:13px;margin-top:14px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;margin-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--ink-2)}
  .chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
  .skel{height:70px;border-radius:var(--radius);background:linear-gradient(90deg,#F2F1ED 25%,#E9E8E3 50%,#F2F1ED 75%);background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:9px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* ---------- mi jugador ---------- */
  .me{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .me label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:7px}

  /* ---------- tarjeta de partido ---------- */
  .m{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;margin-bottom:9px}
  .m.live{border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-soft)}
  .m.mine{border-left:4px solid var(--green)}
  .m-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
  .m-top .div{color:var(--green);font-variation-settings:'wdth' 95}
  .m-top .rnd{color:var(--ink-3);font-weight:600;letter-spacing:.02em;text-transform:none}
  .badge{margin-left:auto;padding:3px 8px;border-radius:99px;font-size:10.5px;letter-spacing:.06em;background:var(--green-soft);color:var(--green);white-space:nowrap}
  .badge.now{background:var(--signal);color:#fff}
  .badge.soon{background:#FFF7E6;color:#8A5A00}
  .badge.tbd{background:#F1F1EE;color:var(--ink-3)}
  .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
  .p{font-size:16px;font-weight:600;letter-spacing:-.01em;min-width:0;overflow-wrap:break-word}
  .p.b{text-align:right}
  .p.tbd{color:var(--ink-3);font-weight:500;font-style:italic}
  .p .loc{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500}
  .p.win{color:var(--green);font-weight:800}
  .p.win::after{content:'✓';margin-left:5px;font-size:12px;vertical-align:1px}
  .p .yo{display:inline-block;margin-left:5px;padding:1px 5px;border-radius:99px;background:var(--green);color:#fff;font-size:9.5px;letter-spacing:.06em;vertical-align:2px}
  .x{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.08em}
  .when{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--ink-2)}
  .when b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
  .when .cd{margin-left:auto;font-weight:700;color:var(--signal);font-variant-numeric:tabular-nums}
  .score{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}

  /* ---------- línea de tiempo ---------- */
  .day{margin:20px 0 10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
  .slot{display:grid;grid-template-columns:62px 1fr;gap:12px;margin-bottom:14px}
  .slot .t{position:relative;padding-top:11px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .slot .t small{display:block;font-size:10px;font-weight:600;color:var(--ink-3);letter-spacing:.06em}
  .slot .t::after{content:'';position:absolute;right:-6px;top:0;bottom:-14px;width:1px;background:var(--line)}
  .slot:last-child .t::after{display:none}
  @media (min-width:640px){ .slot{grid-template-columns:78px 1fr} }

  /* ---------- listas ---------- */
  .lista{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .li{display:flex;align-items:center;gap:11px;width:100%;padding:12px 13px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:15px;color:var(--ink);cursor:pointer}
  .li:last-child{border-bottom:0}
  .li:hover{background:var(--green-soft)}
  .li .nm{font-weight:600;min-width:0}
  .li .nm small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500}
  .li .meta{margin-left:auto;font-size:12px;color:var(--ink-3);text-align:right;white-space:nowrap}
  .li .chev{color:var(--ink-3);font-size:15px}
  .pos{width:26px;text-align:right;font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink-3);font-size:13px}
  .pts{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px}
  .medals{display:flex;gap:8px;font-size:13px;font-weight:700;color:var(--ink-2)}

  /* ---------- ficha jugador ---------- */
  .ficha{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:14px}
  .ficha h3{margin:0;font-size:21px;font-weight:800;font-variation-settings:'wdth' 108;letter-spacing:-.02em}
  .ficha .loc2{color:var(--ink-3);font-size:13px;margin-top:2px}
  .ficha .big{display:flex;gap:18px;margin-top:12px}
  .ficha .big div{text-align:center}
  .ficha .big b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .ficha .big span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .volver{margin-bottom:12px}

  footer{margin-top:30px;padding-top:15px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);line-height:1.6}
  footer a{color:var(--green)}
  @media print{
    header,nav.tabs,.me,.chips,.no-print{display:none!important}
    body{background:#fff} .m{break-inside:avoid;box-shadow:none} .wrap{padding-bottom:0}
  }
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="kicker"><span class="dot" id="dot"></span><span id="estado">Cargando</span></div>
    <h1 id="torneo">Racquetball Chile</h1>
    <div class="sub">
      <span id="sede"></span><span id="fechas"></span><span>Actualizado <b id="upd">—</b></span>
    </div>
    <select id="torneoSel" hidden aria-label="Elegir fecha del circuito"></select>
  </div>
</header>

<div class="wrap"><div id="aviso"></div><main id="app"><div class="skel"></div><div class="skel"></div></main>
  <footer>
    <button onclick="window.print()" class="no-print" style="margin-bottom:12px">Imprimir esta vista</button><br>
    Datos tomados de <a href="#" id="fuente" target="_blank" rel="noopener">r2sports.com</a>, la plataforma oficial del torneo.
    Los horarios los publica la organización y pueden cambiar sin aviso: la hora es la del recinto.
    <span id="disc"></span>
  </footer>
</div>

<nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>

<script>
'use strict';
const $ = function (s) { return document.querySelector(s); };
const el = function (t, c, h) { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
const qs = new URLSearchParams(location.search);

/* ---------- estado ---------- */
let TID = qs.get('tid') || '54324';
// MI es el UID, no el nombre: hay homónimos reales (Rodrigo Salgado Jr. es 96164
// y su papá, Rodrigo Salgado I., es 626220). Buscar por texto los mezclaba.
let MI = qs.get('jugador') || localStorage.getItem('rq.uid') || '';
if (MI) localStorage.setItem('rq.uid', MI);
let T = null, CAT = null, JUG = null, RANK = null;
let VISTA = (location.hash || '#ahora').slice(1).split('/')[0];
let FILTRO_DIV = 'todo', DIA = 'todo', BUSCA = '', TODOS_RES = false;
let DIV_ABIERTA = null, JUG_ABIERTO = null, RANK_CAT = null, RANK_ANIO = 'oficial';

/* ---------- fechas ---------- */
const DIAS = { sunday: 0, monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6 };
const DIA_ES = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MES_ES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function mdy(s) { const m = String(s || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? new Date(+m[3], +m[1] - 1, +m[2]) : null; }
function rangoEs(a, b) {
  const i = mdy(a), f = mdy(b);
  if (!i) return '';
  if (!f || +i === +f) return i.getDate() + ' de ' + MES_ES[i.getMonth()] + ' de ' + i.getFullYear();
  if (i.getMonth() === f.getMonth()) return i.getDate() + ' al ' + f.getDate() + ' de ' + MES_ES[i.getMonth()] + ' de ' + f.getFullYear();
  return i.getDate() + ' de ' + MES_ES[i.getMonth()] + ' al ' + f.getDate() + ' de ' + MES_ES[f.getMonth()] + ' de ' + f.getFullYear();
}
// "Saturday" + "7:40:00 PM" -> fecha real dentro del rango del torneo
function fechaDe(day, time) {
  if (!day || !time || !T) return null;
  const ini = mdy(T.tournament.startDate), fin = mdy(T.tournament.endDate);
  const wd = DIAS[String(day).trim().toLowerCase()];
  if (!ini || wd == null) return null;
  const tm = String(time).match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([AP])M/i);
  if (!tm) return null;
  let h = +tm[1] % 12; if (/p/i.test(tm[3])) h += 12;
  const d = new Date(ini);
  for (let i = 0; i < 8; i++) { if (d.getDay() === wd) break; d.setDate(d.getDate() + 1); }
  if (fin && d > new Date(fin.getFullYear(), fin.getMonth(), fin.getDate(), 23, 59)) return null;
  d.setHours(h, +tm[2], 0, 0);
  return d;
}
function hhmm(d) { return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function haceCuanto(iso) {
  const d = new Date(iso), mins = Math.round((Date.now() - d) / 60000);
  if (mins < 1) return 'ahora';
  if (mins < 60) return 'hace ' + mins + ' min';
  const hs = Math.round(mins / 60);
  if (hs < 24) return 'hace ' + hs + (hs === 1 ? ' hora' : ' horas');
  return 'el ' + d.getDate() + '/' + (d.getMonth() + 1) + ' a las ' + hhmm(d);
}
function faltan(d) {
  const min = Math.round((d - Date.now()) / 60000);
  if (min < 0) return null;
  if (min < 60) return 'en ' + min + ' min';
  const h = Math.floor(min / 60), r = min % 60;
  return 'en ' + h + ' h' + (r ? ' ' + r : '');
}

/* ---------- jugadores ---------- */
const PLACEHOLDER = /^(winner|loser|ganador|perdedor|group|grupo|bye|tbd)\b|^\s*$/i;
function esReal(n) { return !PLACEHOLDER.test(String(n || '')); }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim(); }
function ladosDe(m) { return (m.lado1 || []).concat(m.lado2 || []); }
function esMio(m) {
  if (!MI) return false;
  const l = ladosDe(m);
  if (l.length) return l.some(function (x) { return x.uid === MI; });
  const p = jugador(MI);
  return p ? (norm(m.p1).indexOf(norm(p.name)) >= 0 || norm(m.p2).indexOf(norm(p.name)) >= 0) : false;
}
function jugador(uid) { return ((T && T.players) || []).find(function (p) { return p.uid === uid; }) || null; }
function tieneUid(m, uid) {
  const l = ladosDe(m);
  if (l.length) return l.some(function (x) { return x.uid === uid; });
  return false;
}
function partidosDe(uid) {
  return ((T && T.matches) || []).filter(function (m) {
    return (m.ganador && m.ganador.uid === uid) || (m.perdedor && m.perdedor.uid === uid);
  });
}

/* ---------- tarjetas ---------- */
function nombreConYo(lado, texto) {
  const mio = MI && (lado || []).some(function (x) { return x.uid === MI; });
  return esc(texto || 'Por definir') + (mio ? '<span class="yo">TÚ</span>' : '');
}
function cardPartido(m, opts) {
  opts = opts || {};
  const d = fechaDe(m.day, m.time), mine = esMio(m);
  const c = el('div', 'm' + (opts.live ? ' live' : '') + (mine ? ' mine' : ''));
  const top = el('div', 'm-top');
  top.appendChild(el('span', 'div', esc(m.division)));
  if (m.round) top.appendChild(el('span', 'rnd', '· ' + esc(m.round)));
  let badge;
  if (opts.live) badge = el('span', 'badge now', 'En cancha');
  else if (!d) badge = el('span', 'badge tbd', 'Por confirmar');
  else if (d - Date.now() < 45 * 60000 && d > Date.now()) badge = el('span', 'badge soon', 'Pronto');
  else badge = el('span', 'badge', DIA_ES[d.getDay()]);
  top.appendChild(badge);
  c.appendChild(top);
  const vs = el('div', 'vs');
  vs.appendChild(el('div', 'p' + (esReal(m.p1) ? '' : ' tbd'), nombreConYo(m.lado1, m.p1)));
  vs.appendChild(el('div', 'x', 'VS'));
  vs.appendChild(el('div', 'p b' + (esReal(m.p2) ? '' : ' tbd'), nombreConYo(m.lado2, m.p2)));
  c.appendChild(vs);
  const w = el('div', 'when');
  if (d) {
    w.appendChild(el('b', null, hhmm(d)));
    w.appendChild(el('span', null, DIA_ES[d.getDay()]));
    const f = faltan(d);
    if (opts.live) w.appendChild(el('span', 'cd', 'debió empezar ' + haceCuanto(d.toISOString())));
    else if (f) w.appendChild(el('span', 'cd', f));
  } else w.appendChild(el('span', null, 'La organización aún no fija la hora'));
  c.appendChild(w);
  return c;
}
function cardResultado(m, opts) {
  opts = opts || {};
  const c = el('div', 'm');
  const top = el('div', 'm-top');
  top.appendChild(el('span', 'div', esc(m.division)));
  if (m.round) top.appendChild(el('span', 'rnd', '· ' + esc(m.round)));
  if (opts.badge) top.appendChild(el('span', 'badge', esc(opts.badge)));
  c.appendChild(top);
  const g = m.ganador || {}, p = m.perdedor || {};
  const vs = el('div', 'vs');
  vs.appendChild(el('div', 'p win', esc(g.name || '—') + (g.uid === MI ? '<span class="yo">TÚ</span>' : '') + (g.loc ? '<span class="loc">' + esc(g.loc) + '</span>' : '')));
  vs.appendChild(el('div', 'x', 'def.'));
  vs.appendChild(el('div', 'p b', esc(p.name || '—') + (p.uid === MI ? '<span class="yo">TÚ</span>' : '') + (p.loc ? '<span class="loc">' + esc(p.loc) + '</span>' : '')));
  c.appendChild(vs);
  if (m.marcador) c.appendChild(el('div', 'score', esc(m.marcador)));
  else if (m.forfeit) c.appendChild(el('div', 'score', 'Sin presentación'));
  return c;
}
function h2(titulo, extra) {
  const h = el('div', 'h2');
  h.appendChild(el('span', null, esc(titulo)));
  if (extra) h.appendChild(el('em', null, esc(extra)));
  return h;
}

/* ---------- clasificación de horarios ---------- */
function clasificar() {
  const now = Date.now(), live = [], next = [], sinHora = [];
  ((T && T.schedule) || []).forEach(function (m) {
    const d = fechaDe(m.day, m.time);
    if (!d) { sinHora.push(m); return; }
    // Un partido de racquetball rara vez pasa de una hora: si su horario quedó atrás
    // menos de 75 min y el resultado no está cargado, se asume en cancha.
    const min = (now - d) / 60000;
    if (min >= 0 && min <= 75) live.push(m); else if (d > now) next.push(m); else sinHora.push(m);
  });
  const porHora = function (a, b) { return fechaDe(a.day, a.time) - fechaDe(b.day, b.time); };
  next.sort(porHora); live.sort(porHora);
  return { live: live, next: next, sinHora: sinHora };
}

/* ================= VISTA: AHORA ================= */
function vAhora(app) {
  const g = clasificar();

  // mi jugador
  const me = el('div', 'me');
  me.appendChild(el('label', null, 'Mi jugador'));
  const fila = el('div', 'row');
  const sel = el('select'); sel.id = 'sel';
  sel.appendChild(el('option', null, 'Elige tu nombre de la lista…')).value = '';
  ((T && T.players) || []).slice().sort(function (a, b) { return a.name.localeCompare(b.name, 'es'); })
    .forEach(function (p) {
      const o = el('option'); o.value = p.uid;
      o.textContent = p.name + (p.place ? ' · ' + p.place : '');
      sel.appendChild(o);
    });

/* ================= VISTA: LLAVES ================= */
// Se arma desde los partidos (jugados + programados) y no desde el cuadro de
// r2sports: el parser de cuadros de round robin devuelve basura (mezcla fechas y
// códigos de cancha con los jugadores).
const ORDEN_RONDA = [
  [/^final$/i, 'Final', 100], [/final if|if necessary/i, 'Final extra', 99],
  [/3rd|third|tercer/i, '3er lugar', 95], [/4th|cuarto/i, '4º lugar', 94],
  [/semi/i, 'Semifinales', 90], [/qtr|quarter|cuarto/i, 'Cuartos', 80]
];
function ronda(label) {
  const t = String(label || '').trim();
  for (const [re, nombre, orden] of ORDEN_RONDA) if (re.test(t)) return { nombre: nombre, orden: orden };
  let m = t.match(/(\d+)\s*'?s/);
  if (m) { const n = +m[1], NM = { 8: 'Cuartos', 16: 'Octavos', 32: '16avos', 64: '32avos' }; return { nombre: NM[n] || ('Ronda de ' + n), orden: 70 - n / 10 }; }
  m = t.match(/rnd\s*(\d+)|round:?\s*(\d+)/i);
  if (m) { const n = +(m[1] || m[2]); return { nombre: 'Fecha ' + n, orden: 10 + n }; }
  return { nombre: t || 'Partidos', orden: 50 };
}
function vLlaves(app) {
  const divisiones = {};
  const add = function (m, jugado) {
    const k = m.division;
    (divisiones[k] = divisiones[k] || { nombre: k, jugados: [], pendientes: [] })[jugado ? 'jugados' : 'pendientes'].push(m);
  };
  ((T && T.matches) || []).forEach(function (m) { add(m, true); });
  ((T && T.schedule) || []).forEach(function (m) { add(m, false); });
  const nombres = Object.keys(divisiones).sort();

  if (DIV_ABIERTA && divisiones[DIV_ABIERTA]) {
    const D = divisiones[DIV_ABIERTA];
    const volver = el('button', 'volver', '← Todas las categorías');
    volver.onclick = function () { DIV_ABIERTA = null; render(); };
    app.appendChild(volver);
    app.appendChild(h2(D.nombre, D.jugados.length + ' jugados · ' + D.pendientes.length + ' por jugar'));

    const grupos = {};
    D.jugados.forEach(function (m) {
      const r = ronda(m.round);
      (grupos[r.nombre] = grupos[r.nombre] || { orden: r.orden, jugados: [], pend: [] }).jugados.push(m);
    });
    D.pendientes.forEach(function (m) {
      const r = ronda(m.round);
      (grupos[r.nombre] = grupos[r.nombre] || { orden: r.orden, jugados: [], pend: [] }).pend.push(m);
    });
    Object.keys(grupos).sort(function (a, b) { return grupos[b].orden - grupos[a].orden; }).forEach(function (nombre) {
      app.appendChild(el('div', 'day', nombre));
      grupos[nombre].pend.forEach(function (m) { app.appendChild(cardPartido(m)); });
      grupos[nombre].jugados.forEach(function (m) { app.appendChild(cardResultado(m)); });
    });
    return;
  }

  app.appendChild(h2('Categorías', nombres.length + ''));
  if (!nombres.length) { app.appendChild(el('div', 'empty', 'Todavía no hay partidos publicados en esta fecha.')); return; }
  const lista = el('div', 'lista');
  nombres.forEach(function (n) {
    const D = divisiones[n];
    const b = el('button', 'li');
    b.appendChild(el('span', 'nm', esc(n) + '<small>' + D.jugados.length + ' jugados · ' + D.pendientes.length + ' por jugar</small>'));
    b.appendChild(el('span', 'chev', '›'));
    b.onclick = function () { DIV_ABIERTA = n; render(); window.scrollTo(0, 0); };
    lista.appendChild(b);
  });
  app.appendChild(lista);
}

  }

  $('#upd').textContent = haceCuanto(T.updatedAt);
  $('#fuente').href = 'https://www.r2sports.com/tourney/home.asp?TID=' + T.tid;
  $('#estado').textContent = { 'in-progress': 'En juego', finished: 'Finalizado', upcoming: 'Por comenzar' }[T.status] || 'Torneo';
  $('#dot').style.display = T.status === 'in-progress' ? '' : 'none';
  $('#disc').textContent = ' Última lectura: ' + new Date(T.updatedAt).toLocaleString('es-CL') + '.';

  // selector de fecha del circuito
  if (CAT && CAT.tournaments && CAT.tournaments.length > 1) {
    const s = $('#torneoSel'); s.hidden = false;
    if (!s.options.length) {
      CAT.tournaments.forEach(function (x) {
        const o = el('option'); o.value = x.tid;
        o.textContent = x.name + ' · ' + (x.year || '');
        s.appendChild(o);
      });
      s.onchange = function () { cambiarTorneo(this.value); };
    }
    s.value = TID;
  }

  const av = $('#aviso'); av.innerHTML = '';
  if (T.scheduleStatus === 'cache') {
    av.appendChild(el('div', 'warn', 'r2sports no responde ahora. Estos horarios son los últimos que alcanzamos a leer' +
      (T.horariosDesde ? ' (' + haceCuanto(T.horariosDesde) + ')' : '') + ', así que pueden estar desactualizados.'));
  } else if (T.scheduleStatus && T.scheduleStatus !== 'ok') {
    av.appendChild(el('div', 'warn', 'r2sports no está entregando los horarios en este momento.'));
  } else if (!(T.schedule || []).length && T.status !== 'finished') {
    av.appendChild(el('div', 'warn', 'La organización todavía no publica horarios para esta fecha.'));
  }

  ({ ahora: vAhora, horarios: vHorarios, llaves: vLlaves, jugadores: vJugadores, ranking: vRanking }[VISTA] || vAhora)(app);
}

/* ---------- carga ---------- */
async function json(url) {
  try {
    const r = await fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}
async function cargarTorneo() {
  // Versión portable/offline: un archivo único con los datos incrustados.
  if (window.RQ_DATA) { T = window.RQ_DATA; render(); return; }
  const j = await json('./data/' + TID + '.json') || await json('./data.json');
  if (!j || !j.tournament) {
    $('#app').innerHTML = '';
    $('#app').appendChild(el('div', 'warn', 'No pudimos cargar los datos. Revisa tu conexión y vuelve a intentar.'));
    return;
  }
  T = j; render();
}
async function cargarExtras() {
  if (window.RQ_DATA) return;
  const [c, ju, ra] = await Promise.all([json('./data/index.json'), json('./data/jugadores.json'), json('./data/ranking.json')]);
  CAT = c || CAT; JUG = ju || JUG; RANK = ra || RANK;
  if (T) render();
}
function cambiarTorneo(tid) {
  if (String(tid) === String(TID)) return;
  TID = String(tid);
  JUG_ABIERTO = null; DIV_ABIERTA = null; BUSCA = ''; DIA = 'todo'; FILTRO_DIV = 'todo';
  T = null; render();
  history.replaceState(null, '', '?tid=' + TID + (MI ? '&jugador=' + MI : '') + '#' + VISTA);
  cargarTorneo();
}

window.addEventListener('hashchange', function () {
  const v = (location.hash || '#ahora').slice(1).split('/')[0];
  if (v !== VISTA) { VISTA = v; render(); }
});
pintarTabs();
cargarTorneo().then(cargarExtras);
setInterval(cargarTorneo, 90000);
setInterval(function () { if (T && (VISTA === 'ahora' || VISTA === 'horarios')) render(); }, 60000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) cargarTorneo(); });
</script>
