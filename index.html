<!DOCTYPE html>
<html lang="es" data-v="2026-07-27-13">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Racquetball Chile · ranking y campeonatos</title>
<meta name="description" content="Ranking oficial, campeonatos, llaves y jugadores del Circuito Nacional de Racquetball de Chile.">
<meta name="theme-color" content="#0A4A3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..800;1,62..125,400..700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FCFCFA; --card:#FFFFFF; --ink:#111417; --ink-2:#565E66; --ink-3:#8C949B;
    --line:#E8E6E0; --line-2:#F1EFEA;
    --green:#0A4A3E; --green-2:#0F6E56; --green-soft:#EEF4F1;
    --signal:#C2410C; --signal-soft:#FDF1EA;
    --oro:#8A5A00; --oro-soft:#FBF3E2;
    --radius:12px; --sans:'Archivo','Helvetica Neue',Helvetica,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px calc(104px + env(safe-area-inset-bottom))}

  /* barra superior */
  header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
  .hd{max-width:760px;margin:0 auto;padding:6px 18px;display:flex;align-items:center;gap:10px;min-height:38px}
  .marca{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;cursor:pointer;font:inherit;color:var(--ink);min-width:0}
  .marca b{font-size:14.5px;font-weight:800;letter-spacing:-.015em;white-space:nowrap}
  .marca .pelota{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
  .atras{border:0;background:none;padding:4px 8px 4px 0;margin-left:-4px;cursor:pointer;color:var(--ink-2);display:flex;align-items:center}
  .ctx{margin-left:auto;text-align:right;min-width:0;font-size:11.5px;color:var(--ink-3);line-height:1.25}
  .ctx b{display:block;color:var(--ink-2);font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vivo{display:inline-flex;align-items:center;gap:5px;color:var(--signal);font-weight:700}
  .vivo i{width:7px;height:7px;border-radius:50%;background:var(--signal);animation:lat 1.8s infinite}
  @keyframes lat{0%,100%{opacity:1}50%{opacity:.25}}

  /* barra inferior */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 2px 10px;border:0;background:none;color:var(--ink-3);font-size:11.5px;font-weight:700;cursor:pointer;position:relative}
  .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-current=true]{color:var(--green)}
  .tab[aria-current=true] svg{stroke-width:2.3}
  .tab[aria-current=true]::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--green)}

  /* tipografía y bloques */
  h1{margin:20px 0 12px;font-size:clamp(23px,6.2vw,31px);font-weight:800;letter-spacing:-.03em;line-height:1.08}
  h2{margin:26px 0 8px;font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
  h3{margin:0 0 2px;font-size:19px;font-weight:800;letter-spacing:-.02em}
  p{margin:0}
  .sub{font-size:13px;color:var(--ink-3);margin-top:-4px;margin-bottom:14px}
  .nota{font-size:12px;color:var(--ink-3);margin-top:10px;line-height:1.55}
  .aviso{background:#FFFBEB;border:1px solid #F4E4B8;color:#7A5A00;padding:11px 13px;border-radius:var(--radius);font-size:13px;margin-top:12px}
  .vacio{padding:20px 14px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--ink-3);font-size:14px;text-align:center}
  input,select,button{font:inherit}
  input[type=search]{width:100%;font-size:16px;height:46px;padding:0 12px 0 38px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--ink)}
  input[type=search]:focus{outline:2px solid var(--green);outline-offset:1px;border-color:transparent}
  button{cursor:pointer}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:var(--radius);padding:11px 14px;font-size:14px;font-weight:600;width:100%}
  .btn:active{transform:translateY(1px)}
  .ic{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  /* bloque de bienvenida del inicio. Es lo único con color fuerte en toda la web:
     el resto sigue blanco y pastel a propósito. */
  .hero{position:relative;overflow:hidden;margin:14px 0 4px;padding:18px 16px 17px;border-radius:16px;color:#fff;background:linear-gradient(135deg,var(--green) 0%,var(--green-2) 100%)}
  .hero::after{content:'';position:absolute;right:-46px;top:-46px;width:168px;height:168px;border-radius:50%;background:rgba(255,255,255,.07)}
  .hero>*{position:relative;z-index:1}
  .hero h1{margin:0 0 14px;font-size:23px;line-height:1.18;font-weight:800;letter-spacing:-.015em;max-width:22ch}
  .hero .buscar{margin-bottom:0}
  .hero .buscar .lupa{color:var(--green-2)}
  .hero input[type=search]{border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.14)}
  .hero input[type=search]:focus{outline:2px solid #fff;outline-offset:2px}
  .hero .pista{margin-top:9px;font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.82)}
  .hero .nota{color:rgba(255,255,255,.8)}
  @media(min-width:560px){ .hero{padding:24px 22px 22px} .hero h1{font-size:27px} }

  /* buscador */
  .buscar{position:relative;margin-bottom:6px}
  .buscar .lupa{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);display:flex}
  .sug{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:6px}
  .sug button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left}
  .sug button:last-child{border-bottom:0}
  .sug button:hover{background:var(--green-soft)}
  .sug .n{font-size:15px;font-weight:600;min-width:0}
  .sug .n small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500}
  .sug mark{background:none;color:var(--green-2);font-weight:800}

  /* filas de partido */
  .m{display:grid;grid-template-columns:64px minmax(0,1fr);gap:13px;padding:13px 0;border-top:1px solid var(--line-2)}
  .m:first-child{border-top:0}
  .m-izq b{display:block;font-size:20px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.1}
  .m-izq span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:1px}
  .m-izq .cd{color:var(--signal);font-weight:700}
  .m-izq .sin{font-size:13px;font-weight:700;color:var(--ink-3)}
  .m-cat{font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:3px}
  .m-cat b{color:var(--green-2)}
  .p{font-size:16.5px;font-weight:600;letter-spacing:-.012em;line-height:1.42;overflow-wrap:break-word}
  .p.b{color:var(--ink-2)}
  .p.gana{font-weight:800}
  .p.tbd{color:var(--ink-3);font-weight:500;font-style:italic;font-size:15px}
  .p .loc{font-size:12px;color:var(--ink-3);font-weight:500;margin-left:6px}
  .m.live{background:var(--signal-soft);border-radius:var(--radius);padding:13px 12px;margin:5px 0;border-top:0}
  .m.live .m-izq b{color:var(--signal)}
  .marca-set{font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;color:var(--ink-2);margin-top:4px}
  .nom{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
  .nom:hover{text-decoration-color:var(--green-2)}

  /* listas y tarjetas */
  .lista{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:8px}
  .li{display:flex;align-items:center;gap:11px;width:100%;padding:13px;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left;font-size:15px;color:var(--ink)}
  .li:last-child{border-bottom:0}
  .li:hover{background:var(--green-soft)}
  .li .nm{font-weight:600;min-width:0;flex:1}
  .li .nm small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500}
  .li .meta{font-size:12.5px;color:var(--ink-3);text-align:right;white-space:nowrap}
  .li .pos{width:28px;text-align:right;font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink-3);font-size:13.5px}
  .li .pts{font-variant-numeric:tabular-nums;font-weight:800;font-size:15.5px}
  .li.top .pos{color:var(--oro)}
  .li.top{background:var(--oro-soft)}
  .cards{display:grid;grid-template-columns:1fr;gap:9px;margin-top:8px}
  @media (min-width:560px){ .cards{grid-template-columns:1fr 1fr} }

  /* tablero de la portada: cuadros de distinto tamaño, el grande es lo que importa */
  .tablero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .t2{grid-column:span 2}
  .tile{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .tile:hover{border-color:var(--green-2)}
  .tile .rot{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;color:var(--ink-3);margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .tile .cifra{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1}
  .tile .pie{font-size:12px;color:var(--ink-3);margin-top:4px}
  .tile.viva{background:var(--signal-soft);border-color:#F3D9CB}
  .tile.viva .rot{color:var(--signal)}
  .tile.viva .punto{width:7px;height:7px;border-radius:50%;background:var(--signal);animation:lat 1.8s infinite}
  .tile.verde{background:var(--green-soft);border-color:#D8E7E0}
  .tile.verde .rot{color:var(--green-2)}
  .duelo{font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.32}
  .duelo em{font-style:normal;color:var(--ink-3);font-weight:600}
  .duelo-pie{font-size:12px;color:var(--ink-3);margin:1px 0 0}
  .duelo + .duelo{margin-top:9px}
  .hora-gr{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:baseline}
  .hora-gr b{font-size:25px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .podio{display:flex;align-items:baseline;gap:9px;padding:5px 0;font-size:15px}
  .podio + .podio{border-top:1px solid var(--line-2)}
  .podio i{font-style:normal;width:15px;font-size:12.5px;font-weight:800;color:var(--ink-3);flex:none}
  .podio b{font-weight:600}
  .podio span{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink-2)}
  .podio.uno i{color:var(--oro)}
  .podio.uno b{font-weight:800}
  .mini{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}
  .mini span{color:var(--ink-3);white-space:nowrap}

  /* bloque de una fecha: fondo pastel propio para que al hacer scroll se note
     dónde empieza y dónde termina cada campeonato */
  .fecha{border-radius:18px;padding:14px;margin-top:16px}
  .fecha.f1{background:#EEF4F1}
  .fecha.f2{background:#FAF3E6}
  .fecha.f3{background:#F0F1F7}
  .fecha-cab{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;padding:0 2px}
  .fecha-cab .txt{min-width:0;cursor:pointer}
  .fecha-cab h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
  .fecha-cab .cuando{font-size:12.5px;color:var(--ink-2);margin-top:2px}
  .fecha-cab .marca-viva{flex:none;display:inline-flex;align-items:center;gap:5px;background:var(--signal);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;margin-left:auto}
  .fecha .catbox{border-color:rgba(17,20,23,.08)}
  .fecha .btn{background:rgba(255,255,255,.72);border-color:rgba(17,20,23,.1)}

  /* podio por categoría */
  .catbox{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;display:block}
  button.catbox:hover{border-color:var(--green-2)}
  .catbox-cab{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line-2)}
  .catbox-cab b{font-size:16px;font-weight:800;letter-spacing:-.015em}
  .catbox-cab span{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:700;white-space:nowrap}
  .catbox-vacio{font-size:12px;color:var(--ink-3);margin-top:6px}
  .pod-fila{display:flex;align-items:baseline;gap:9px;font-size:15.5px;padding:3px 0}
  .pod-fila i{font-style:normal;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:800;color:var(--ink-3);min-width:74px;flex:none}
  .pod-fila b{font-weight:600;min-width:0}
  .pod-fila > span{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
  .pod-fila:first-of-type i{color:var(--oro)}
  .pod-fila:first-of-type b{font-weight:800}
  .card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px}
  .card:hover{border-color:var(--green-2)}
  .card .t{font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
  .card .n{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
  .card .d{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .card .l{display:flex;align-items:baseline;gap:7px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line-2)}
  .card .l b{font-size:15px;font-weight:700}
  .card .l span{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:15px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;color:var(--ink-2)}
  .chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
  .dia{margin:20px 0 2px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--ink-2)}

  /* llaves */
  .rondas{display:flex;align-items:center;gap:8px;margin:10px 0 4px}
  .rondas .nomr{flex:1;text-align:center;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .flecha{width:38px;height:38px;border-radius:99px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
  .flecha[disabled]{opacity:.35}
  .cuadro{overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
  .cuadro-in{display:flex;gap:14px;min-width:min-content}
  .col{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-width:172px}
  .col .rot{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--ink-3);text-align:center}
  .cruce{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 9px;font-size:13px}
  .cruce div{display:flex;gap:6px;align-items:baseline}
  .cruce div b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:700;font-size:12px}
  .cruce .g{font-weight:800}
  .cruce .l2{color:var(--ink-3)}
  table.pos{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  table.pos th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:9px 8px;border-bottom:1px solid var(--line)}
  table.pos th:first-child{text-align:left}
  table.pos td{padding:10px 8px;border-bottom:1px solid var(--line-2);text-align:right;font-variant-numeric:tabular-nums}
  table.pos td:first-child{text-align:left;font-weight:600}
  table.pos tr:last-child td{border-bottom:0}

  /* perfil con color */
  .p-hero{border-radius:18px;padding:16px;background:var(--green-soft);margin-top:16px}
  .p-hero.oro{background:#FBF3E2}
  .p-hero .arriba{display:flex;gap:14px;align-items:center}
  .p-hero .foto{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#fff;flex:none}
  .p-hero .ini{width:76px;height:76px;border-radius:50%;background:#fff;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;flex:none}
  .p-hero h3{margin:0;font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
  .p-hero .donde{font-size:13px;color:var(--ink-2);margin-top:3px}
  .p-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .p-chip{background:#fff;border-radius:99px;padding:6px 11px;font-size:13px;font-weight:700;color:var(--ink);display:inline-flex;gap:6px;align-items:baseline;border:0}
  .p-chip i{font-style:normal;font-weight:800;color:var(--green-2)}
  .p-chip.oro i{color:var(--oro)}
  .p-chip small{font-size:11.5px;color:var(--ink-3);font-weight:600}
  .medallas{display:flex;gap:12px;margin-top:12px;font-size:14px;font-weight:700;color:var(--ink-2)}
  .medallas span{display:inline-flex;gap:5px;align-items:center}
  .forma{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .forma button{width:34px;height:34px;border-radius:9px;border:2px solid transparent;font-size:13px;font-weight:800;color:#fff;background:var(--green-2);padding:0}
  .forma button.p{background:#C2410C}
  .forma button[aria-pressed=true]{border-color:var(--ink)}
  .detalle{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;margin-top:9px;font-size:14.5px}
  .detalle .cuando{font-size:12px;color:var(--ink-3);margin-top:2px}
  .detalle ul{margin:4px 0 0;padding-left:18px}
  .detalle li{margin:3px 0;font-size:14.5px}
  .detalle li small{color:var(--ink-3);font-size:12.5px}
  .medallas button{background:none;border:0;padding:4px 8px;border-radius:9px;font:inherit;font-size:14px;font-weight:700;color:var(--ink-2);display:inline-flex;gap:5px;align-items:center}
  .medallas button[aria-pressed=true]{background:#fff}
  .medallas button:disabled{opacity:.4}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px}
  .kpi b{display:block;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .kpi span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .kpi.buena b{color:var(--green-2)}
  .kpi.mala b{color:var(--signal)}
  .graf{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px;margin-bottom:9px}
  .graf .tit{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .graf .tit b{font-size:15px;font-weight:800}
  .graf .tit span{margin-left:auto;font-size:12px;color:var(--ink-3)}
  .graf svg{width:100%;height:124px;display:block;overflow:visible}
  .graf.puesto svg{height:146px}
  .graf .delta{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--green-soft);color:var(--green-2)}

  .arbol{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px;padding-bottom:6px}

<body>
<header><div class="hd" id="hd"></div></header>
<div class="wrap"><div id="avisos"></div><main id="app"></main>
  <footer id="pie"></footer>
</div>
<nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>

<script>
'use strict';
const $ = function (s) { return document.querySelector(s); };
const el = function (t, c, h) { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
const qs = new URLSearchParams(location.search);

/* ---------- estado ---------- */
let RUTA = { vista: 'inicio' };     // {vista, tid, cat, uid, sub}
let T = null;                        // torneo abierto
let CAT = null, JUG = null, RK = null, HIST = null, TNOM = null;
let DIA = 'todo', CATAG = 'todo', RONDA = 0, CUADRO = false, CAT_PERFIL = '';
// Qué fechas de la portada están desplegadas (por tid). Se conserva al repintar.
const EXPANDIDAS = {};

/* ---------- fechas ---------- */
const DIAS = { sunday: 0, monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6 };
const DIA_ES = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MES_ES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function mdy(s) { const m = String(s || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? new Date(+m[3], +m[1] - 1, +m[2]) : null; }
function rangoEs(a, b) {
  const i = mdy(a), f = mdy(b);
  if (!i) return '';
  if (!f || +i === +f) return i.getDate() + ' ' + MES_ES[i.getMonth()].slice(0, 3) + ' ' + i.getFullYear();
  if (i.getMonth() === f.getMonth()) return i.getDate() + '-' + f.getDate() + ' ' + MES_ES[i.getMonth()].slice(0, 3) + ' ' + f.getFullYear();
  return i.getDate() + ' ' + MES_ES[i.getMonth()].slice(0, 3) + ' - ' + f.getDate() + ' ' + MES_ES[f.getMonth()].slice(0, 3) + ' ' + f.getFullYear();
}
function hhmm(d) { return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
// Fecha y hora completas, en la hora del que mira. Va al pie, como última
// actualización: arriba ocupaba una esquina entera para decir algo que no cambia.
function fechaHora(iso) {
  const d = new Date(iso);
  if (!iso || isNaN(d.getTime())) return null;
  return d.getDate() + ' ' + MES_ES[d.getMonth()].slice(0, 3) + ' ' + d.getFullYear() + ', ' + hhmm(d) + ' h';
}
function haceCuanto(iso) {
  const d = new Date(iso), min = Math.round((Date.now() - d) / 60000);
  if (min < 1) return 'ahora';
  if (min < 60) return 'hace ' + min + ' min';
  const h = Math.round(min / 60);
  if (h < 24) return 'hace ' + h + (h === 1 ? ' hora' : ' horas');
  const dias = Math.round(h / 24);
  return dias < 30 ? 'hace ' + dias + (dias === 1 ? ' día' : ' días') : 'el ' + d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear();
}
function faltan(d) {
  const min = Math.round((d - Date.now()) / 60000);
  if (min < 0) return null;
  if (min < 60) return 'en ' + min + ' min';
  const h = Math.floor(min / 60), r = min % 60;
  return 'en ' + h + ' h' + (r ? ' ' + r : '');
}
// Nombre corto para las tarjetas de la portada: lo que distingue a una fecha de
// otra es CUÁNDO fue, no el rótulo burocrático ("SEGUNDA FECHA 2026 - CIRCUITO
// NACIONAL OPEN"). Queda "Nacional julio 2026", y la ciudad va aparte y más chica.
function tituloFecha(t) {
  const tipo = /junior/i.test(t.name || '') ? 'Nacional Junior' : 'Nacional';
  const d = mdy(t.startDate);
  if (!d) return tipo;
  return tipo + ' ' + MES_ES[d.getMonth()] + ' ' + d.getFullYear();
}
// "Parque Deportivo Estadio Nacional - Santiago, Santiago CHI" -> "Santiago"
function ciudadDe(venue) {
  const v = String(venue || '');
  const tras = v.indexOf('-') >= 0 ? v.slice(v.indexOf('-') + 1) : v;
  return tras.split(',')[0].replace(/\bCHI\b/, '').trim();
}
// r2sports pone nombres larguísimos: "Torneo Nacional Junior - Clasificatorio
// adulto". Se corta en el guión y se le agrega el año.
function nombreCorto(nombre, fecha) {
  let s = String(nombre || '').replace(/\s*[-–]\s*.*$/, '').trim();
  s = s.replace(/^(torneo|campeonato)\s+/i, '').replace(/\s*\d{4}\s*$/, '').trim();
  s = s.replace(/\b([A-ZÁÉÍÓÚÑ]{4,})\b/g, function (w) { return w[0] + w.slice(1).toLowerCase(); });
  const a = (String(fecha || '').match(/\/(\d{4})/) || [])[1];
  return (s || 'Torneo') + (a ? ' ' + a : '');
}
function fechaDe(day, time, torneo) {
  const t = torneo || T;
  if (!day || !time || !t) return null;
  const ini = mdy(t.tournament.startDate), fin = mdy(t.tournament.endDate);
  const wd = DIAS[String(day).trim().toLowerCase()];
  if (!ini || wd == null) return null;
  const tm = String(time).match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([AP])M/i);
  if (!tm) return null;
  let h = +tm[1] % 12; if (/p/i.test(tm[3])) h += 12;
  const d = new Date(ini);
  for (let i = 0; i < 8; i++) { if (d.getDay() === wd) break; d.setDate(d.getDate() + 1); }
  if (fin && d > new Date(fin.getFullYear(), fin.getMonth(), fin.getDate(), 23, 59)) return null;
  d.setHours(h, +tm[2], 0, 0);
  return d;
}

/* ---------- jugadores ---------- */
// r2sports rellena los cuadros con marcadores de posición: "Winner Semis",
// "Grupo 1 - 2do" y líneas de guiones bajos cuando el cruce está vacío.
const PLACEHOLDER = /^(winner|loser|ganador|perdedor|group|grupo|bye|tbd)\b|^[\s_·.-]*$/i;
function esReal(n) { return !PLACEHOLDER.test(String(n || '')); }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim(); }
function jugadores() { return (JUG && JUG.jugadores) || []; }
function porUid(uid) { return jugadores().find(function (j) { return j.uid === String(uid); }) || null; }
function porNombre(n) {
  const k = norm(n);
  return jugadores().find(function (j) { return (j.alias || []).some(function (a) { return norm(a) === k; }); }) || null;
}
function foto(j) {
  if (!j || !j.uid) return null;
  return 'https://www.r2sports.com/tourney/imageGallery/gallery/player/' + j.uid + '_large.jpg';
}
function iniciales(n) { return String(n || '?').split(' ').filter(Boolean).map(function (x) { return x[0]; }).slice(0, 2).join('').toUpperCase(); }

/* ---------- navegación ---------- */
function ir(r, reemplazar) {
  RUTA = Object.assign({ vista: 'inicio' }, r);
  const h = '#' + [RUTA.vista, RUTA.tid, RUTA.cat, RUTA.uid].filter(Boolean).map(encodeURIComponent).join('/');
  if (reemplazar) history.replaceState(null, '', h); else history.pushState(null, '', h);
  RONDA = 0; CUADRO = false; DIA = 'todo'; CATAG = 'todo';
  pintar(); window.scrollTo(0, 0);
}
function leerHash() {
  const p = (location.hash || '#inicio').slice(1).split('/').map(decodeURIComponent);
  const v = p[0] || 'inicio';
  if (v === 'jugador') return { vista: 'jugador', uid: p[1] };
  if (v === 'campeonato') return { vista: 'campeonato', tid: p[1], cat: p[2] };
  return { vista: v };
}
// Campeonatos vuelve a la barra. Se había sacado por repetir el inicio, pero el
// inicio solo muestra las tres últimas fechas con podio: la que está por empezar
// y las de 2025 y 2024 quedaban escondidas detrás de un botón al final de la
// portada, y nadie lo encontraba.
const TABS = [
  ['inicio', 'Inicio', '<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V20h12v-9.5"/>'],
  ['campeonatos', 'Fechas', '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>'],
  ['ranking', 'Ranking', '<path d="M5 20V11M12 20V4M19 20v-7"/>'],
  ['jugadores', 'Jugadores', '<circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-3.6 3.8-5.4 7-5.4s5.8 1.8 7 5.4"/>']
];
function pintarTabs() {
  const c = $('#tabs'); c.innerHTML = '';
  const activa = { jugador: 'jugadores', campeonato: 'campeonatos' }[RUTA.vista] || RUTA.vista;
  TABS.forEach(function (t) {
    const b = el('button', 'tab', '<svg viewBox="0 0 24 24" aria-hidden="true">' + t[2] + '</svg>' + t[1]);
    b.setAttribute('aria-current', activa === t[0]);
    b.onclick = function () { ir({ vista: t[0] }); };
    c.appendChild(b);
  });
}
function pintarHeader() {
  const hd = $('#hd'); hd.innerHTML = '';
  const detalle = RUTA.vista === 'jugador' || RUTA.vista === 'campeonato';
  if (detalle) {
    const a = el('button', 'atras', '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>');
    a.setAttribute('aria-label', 'Volver');
    a.onclick = function () { history.back(); };
    hd.appendChild(a);
  }
  // En el Inicio no va la marca: el título del bloque verde ya dice qué es esto, y
  // el punto verde con "Racquetball Chile" encima solo repetía. En las otras vistas
  // se queda, porque es el atajo para volver.
  if (RUTA.vista !== 'inicio') {
    const m = el('button', 'marca', '<span class="pelota"></span><b>Racquetball Chile</b>');
    m.setAttribute('aria-label', 'Ir al inicio');
    m.onclick = function () { ir({ vista: 'inicio' }); };
    hd.appendChild(m);
  }

  const ctx = el('div', 'ctx');
  const activo = torneoActivo();
  if (RUTA.vista === 'campeonato' && T) {
    ctx.innerHTML = '<b>' + esc(nombreCorto(T.tournament.name, T.tournament.startDate)) + '</b>' + esc(rangoEs(T.tournament.startDate, T.tournament.endDate));
  } else if (activo && !(T && String(T.tid) === String(activo.tid) && terminado(T))) {
    ctx.innerHTML = '<span class="vivo"><i></i>en juego</span><br>' + esc(nombreCorto(activo.name, activo.startDate));
  }
  // Ya no dice "ranking oficial · junio 2026": era media pantalla de alto para un
  // dato que no cambia en meses. Ahora vive en el pie, con la última actualización.
  if (ctx.innerHTML) hd.appendChild(ctx);
  // Sin marca, sin flecha y sin contexto no queda nada que mostrar: la barra se
  // esconde entera en vez de dejar una franja vacía sobre el bloque verde.
  const barra = hd.parentNode;
  if (barra) barra.style.display = hd.children.length ? '' : 'none';
}

/* ---------- catálogo de campeonatos ---------- */
// El estado se calcula acá y no se lee del archivo: el que viene guardado quedó
// congelado el día que se generó, así que en septiembre un torneo de julio seguía
// apareciendo como "jugándose ahora".
function estadoDe(t) {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const i = mdy(t.startDate), f = mdy(t.endDate) || i;
  if (!i) return t.status || 'finished';
  if (f && f < hoy) return 'finished';
  if (i > hoy) return 'upcoming';
  // Dentro de sus fechas pero sin nada real por jugar: terminó. El "Final If" de
  // la doble eliminación queda listado como pendiente aunque no se juegue nunca.
  const c = t.counts || {};
  if (c.pendientes != null && c.pendientes === 0 && (c.matches || 0) > 0) return 'finished';
  return 'in-progress';
}
// Con el torneo ya cargado se puede saber igual, sin depender de counts.
function pendientesReales(t) {
  return ((t && t.schedule) || []).filter(function (m) {
    return (m.day && m.time) || (esReal(m.p1) && esReal(m.p2));
  }).length;
}
function terminado(t) {
  if (!t) return false;
  return pendientesReales(t) === 0 && ((t.matches || []).length > 0);
}
function catalogo() {
  const t = ((CAT && CAT.tournaments) || []).slice().map(function (x) {
    return Object.assign({}, x, { estado: estadoDe(x) });
  });
  t.sort(function (a, b) { return String(b.dateKey || '').localeCompare(String(a.dateKey || '')); });
  return t;
}
function torneoActivo() { return catalogo().find(function (x) { return x.estado === 'in-progress'; }) || null; }
function ultimoJugado() { return catalogo().find(function (x) { return x.estado === 'finished'; }) || catalogo()[0] || null; }
// Para la portada: la fecha más reciente que SÍ tenga podios publicados. Si el
// último torneo terminó pero la Federación no cargó nada, mostrar su tarjeta vacía
// deja la portada con cara de error.
function ultimaConPodios() {
  return catalogo().find(function (x) { return x.estado === 'finished' && ((x.counts || {}).finishedDivisions || 0) > 0; }) || ultimoJugado();
}

/* ---------- piezas ---------- */
function nodoJugadores(lista, textoPlano, extra) {
  const wrap = el('span');
  const usa = (lista || []).filter(function (x) { return x && x.name; });
  if (!usa.length) wrap.innerHTML = esc(textoPlano || 'Por definir');
  else usa.forEach(function (x, i) {
    if (i) wrap.appendChild(document.createTextNode(' / '));
    const reg = x.uid ? porUid(x.uid) : porNombre(x.name);
    const uid = (reg && reg.uid) || x.uid;
    if (uid) {
      const b = el('button', 'nom', esc(x.name));
      b.setAttribute('aria-label', 'Ver el perfil de ' + x.name);

  const sirve = function (m, jugado) {
    if (jugado) return esReal((m.ganador || {}).name) || esReal((m.perdedor || {}).name);
    return (m.day && m.time) || (esReal(m.p1) && esReal(m.p2));
  };
  C.jugados.filter(function (m) { return sirve(m, true); }).forEach(function (m) { const r = ronda(m.round); (grupos[r.nombre] = grupos[r.nombre] || { orden: r.orden, jugados: [], pend: [] }).jugados.push(m); });

  if (!Object.keys(grupos).some(function (n) { return /^Final/.test(n); })) {

    const G = grupos[nombres[RONDA]];

function posicionesGrupo(jugados) {
  const t = {};
  jugados.forEach(function (m) {
    const g = m.ganador || {}, p = m.perdedor || {};
    const gs = m.games || [];
    const sg = gs.filter(function (x) { return x.w > x.l; }).length, sp = gs.filter(function (x) { return x.l > x.w; }).length;
    [[g, true, sg, sp], [p, false, sp, sg]].forEach(function (par) {
      const q = par[0]; if (!q.name) return;
      const k = q.uid || q.name;
      const r = t[k] || (t[k] = { uid: q.uid || '', nombre: q.name, pj: 0, g: 0, p: 0, setsG: 0, setsP: 0 });
      r.pj++; if (par[1]) r.g++; else r.p++;
      r.setsG += par[2]; r.setsP += par[3];
    });
  });
  return Object.keys(t).map(function (k) { return t[k]; })
    .sort(function (a, b) { return (b.g - a.g) || ((b.setsG - b.setsP) - (a.setsG - a.setsP)) || a.nombre.localeCompare(b.nombre, 'es'); });
}

// Cómo se movió el PUESTO fecha a fecha. La Federación publica un solo corte, así
// que la posición intermedia se calcula sumando sus puntos oficiales hasta cada
// fecha y ordenando la categoría completa con el mismo criterio de desempate. El
// último punto coincide con el puesto oficial, que es la prueba de que calza.
//
// Las fechas vienen de `data/ranking-oficial.json` ya ordenadas por tiempo, no por
// la posición de la columna en el PDF (ver el comentario de FECHAS en
// generar-ranking-oficial.js). Esa es la única forma de que la curva se lea de
// izquierda a derecha como pasó de verdad.
function evolucionPuesto(r, j) {
  const C = ((RK && RK.categorias) || []).find(function (c) { return c.key === r.key; });
  if (!C || !C.fechas || C.fechas.length < 2) return null;
  const yo = norm(j.nombre);
  const soyYo = function (p) {
    const n = norm(p.nombre);
    return n === yo || (j.alias || []).some(function (a) { return norm(a) === n; });
  };
  if (!C.jugadores.some(soyYo)) return null;
  // El PDF trae la grilla completa de fechas para todas las categorías, incluidas
  // las que esa categoría no jugó o que la Federación todavía no puntuó (la 2ª
  // Santiago 2026 está en 0 en Singles Open). Esas columnas dibujaban un tramo
  // plano y hacían que la insignia dijera "sin cambio" en la última fecha.
  const reales = C.fechas.map(function (f, i) { return i; }).filter(function (i) {
    return C.jugadores.some(function (p) { return ((p.fechas || [])[i] || {}).pts; });
  });
  if (reales.length < 2) return null;
  const salida = [];
  reales.forEach(function (i) {
    const f = C.fechas[i];
    const tabla = C.jugadores.map(function (p) {
      let pts = 0, jug = 0;
      (p.fechas || []).slice(0, i + 1).forEach(function (x) { pts += (x.pts || 0); if (x.pts) jug++; });
      return { nombre: p.nombre, pts: pts, jug: jug, yo: soyYo(p) };
    }).filter(function (p) { return p.pts > 0; })
      .sort(function (a, b) { return (b.pts - a.pts) || (a.jug - b.jug) || a.nombre.localeCompare(b.nombre, 'es'); });
    // Puesto compartido en los empates, igual que el ranking oficial: nueve
    // jugadores con 300 puntos y una fecha son todos 68º, no del 68º al 76º. Usar
    // la posición cruda hacía que el último punto del gráfico (73º) no calzara con
    // el puesto oficial (68º).
    const idx = tabla.findIndex(function (p) { return p.yo; });
    let puesto = null;
    if (idx >= 0) {
      const mio = tabla[idx];
      const mejores = tabla.filter(function (p) {
        return p.pts > mio.pts || (p.pts === mio.pts && p.jug < mio.jug);
      }).length;
      puesto = mejores + 1;

    salida.push({ nombre: f.nombre, etiqueta: f.etiqueta, puesto: puesto, de: tabla.length });
  });
  return salida.filter(function (x, i) { return x.puesto || salida.slice(i).some(function (y) { return y.puesto; }); });
}
// El eje va con mes y año ("ago 2024"), en dos líneas para que quepan siete. Antes

// de 2026). El mes y el año salen de la fecha misma, no del nombre.

function graficoPuesto(r, j) {
  const ev = evolucionPuesto(r, j);

  const conDato = ev.filter(function (x) { return x.puesto; });
  if (!conDato.length) return null;

  // La tarjeta completa lleva al ranking de esa categoría.
  const caja = el('button', 'graf puesto');
  caja.onclick = function () { ir({ vista: 'ranking', cat: r.key }); };
  const tit = el('div', 'tit');
  tit.appendChild(el('b', null, esc(nombreCat(r.categoria)) + ' · ' + r.puesto + 'º de ' + (((RK && RK.categorias) || []).find(function (c) { return c.key === r.key; }) || {}).conPuntos + ' con puntos'));
  const ini = conDato[0].puesto, fin = conDato[conDato.length - 1].puesto;
  // La insignia mide la ÚLTIMA fecha, no todo el año: decir "bajó 1" a alguien que

  const dif = previo - fin;
  tit.appendChild(el('span', 'delta' + (unaSola ? ' igual' : dif > 0 ? '' : dif < 0 ? ' baja' : ' igual'),

  const mejor = Math.min.apply(null, conDato.map(function (x) { return x.puesto; }));
  const rango = Math.max(1, peor - mejor);

  // punto no hay recorrido, así que se dibuja al medio.

  const linea = pts.map(function (o, k) { return (k ? 'L' : 'M') + x(o.i).toFixed(1) + ' ' + y(o.e.puesto).toFixed(1); }).join(' ');
  let svg = '<svg viewBox="0 0 ' + W + ' ' + (H + 33) + '" role="img" aria-label="Puesto fecha a fecha en ' + esc(nombreCat(r.categoria)) + '">';
  svg += '<path d="' + linea + '" fill="none" stroke="var(--green)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function (o, k) {

    svg += '<text class="' + (ultimo ? 'fin' : 'puestos') + '" x="' + x(o.i).toFixed(1) + '" y="' + (y(o.e.puesto) - 11).toFixed(1) + '" text-anchor="middle">' + o.e.puesto + 'º</text>';
  });
  ev.forEach(function (e, i) {

  const desde = conDato[0].etiqueta || conDato[0].nombre;

    ? ('Sumó puntos en una sola fecha (' + esc(desde) + ') y quedó ' + fin + 'º.')
    : ini === fin ? ('Se mantuvo ' + fin + 'º desde ' + esc(desde) + ' hasta ' + esc(hasta) + '.')
      : ('En ' + esc(desde) + ' iba ' + ini + 'º y en ' + esc(hasta) + ' quedó ' + fin + 'º.');
  caja.appendChild(el('div', 'verpie', 'Ver el ranking completo de ' + esc(nombreCat(r.categoria)) + ' ›'));
  caja.appendChild(el('div', 'nota', recorrido +
    ' Las fechas van de la más antigua a la más nueva, de izquierda a derecha. ' +
    (unaSola ? '' : 'La insignia de arriba compara solo con la fecha anterior. ') +
    'Cada punto es el puesto que tenía sumando sus puntos oficiales hasta esa fecha. ' +
    'El corte del ranking es de ' + ((RK && RK.corte && RK.corte.etiqueta) || 'junio 2026') + ': los torneos posteriores todavía no cuentan.'));
  return caja;
}
// Línea de puntos acumulados por fecha. SVG a mano: son seis puntos, no hace

function carreraDe(j) {
  const uids = [j.uid].concat(j.uidFusionados || []).filter(Boolean).map(String);
  const P = (HIST && HIST.partidos) || [];
  const out = [];
  const visto = {};
  const clave = function (tid, rivales, marcador) {
    return tid + '|' + (rivales || []).map(function (r) { return r.uid || r.name; }).sort().join('+') + '|' + (marcador || '');
  };
  // Primero los partidos de los torneos que ya están descargados: son los más
  // frescos y existen incluso para jugadores cuya carrera todavía no bajamos.
  // Franco Jimenez jugó el Nacional Junior y su perfil salía vacío porque solo se
  // miraba el histórico.
  Object.keys(cache).forEach(function (tid) {
    const t = cache[tid];
    ((t && t.matches) || []).forEach(function (m) {
      const l1 = (m.lado1 && m.lado1.length) ? m.lado1 : (m.ganador ? [m.ganador] : []);
      const l2 = (m.lado2 && m.lado2.length) ? m.lado2 : (m.perdedor ? [m.perdedor] : []);
      const gane = l1.some(function (x) { return uids.indexOf(String(x.uid)) >= 0; });
      const perdi = l2.some(function (x) { return uids.indexOf(String(x.uid)) >= 0; });
      if (!gane && !perdi) return;
      const rivales = gane ? l2 : l1;
      const k = clave(tid, rivales, m.marcador);
      if (visto[k]) return;
      const exacta = fechaDe(m.day, m.time, t);
      const d = exacta || mdy((t.tournament || {}).endDate) || mdy((t.tournament || {}).startDate);
      const reg = {
        gane: gane, rivales: rivales, mios: gane ? l1 : l2, marcador: m.marcador || '',
        forfeit: !!m.forfeit,
        torneo: nombreTorneo(tid), tid: tid, fecha: d, aprox: !exacta,
        fechaTxt: d ? (d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear()) : '',
        division: m.division, ronda: m.round
      };
      visto[k] = reg;
      out.push(reg);
    });
  });
  P.forEach(function (m) {
    const gan = m.ganador || [], per = m.perdedor || [];
    const enG = gan.some(function (x) { return uids.indexOf(String(x.uid)) >= 0; });
    const enP = per.some(function (x) { return uids.indexOf(String(x.uid)) >= 0; });
    if (!enG && !enP) return;
    const d = m.date ? new Date(m.date) : null;
    const rivales = enG ? per : gan;
    const k = clave(m.tid, rivales, m.marcador);
    const ya = visto[k];
    if (ya) {
      // El torneo descargado no siempre trae el día del partido y ahí la fecha cae
      // al último día del torneo. El histórico sí trae el día exacto: se corrige,
      // que ahora la fecha se muestra partido por partido en el cara a cara.
      if (ya.aprox && d && !isNaN(d)) {
        ya.fecha = d; ya.aprox = false;
        ya.fechaTxt = d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear();
      }
      return;
    }
    visto[k] = true;
    out.push({
      gane: enG, rivales: rivales, mios: enG ? gan : per, marcador: m.marcador || '',
      forfeit: !!m.forfeit,
      torneo: nombreTorneo(m.tid), tid: m.tid, fecha: d,
      fechaTxt: d && !isNaN(d) ? (d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear()) : (m.date || '')
      // El "round" del histórico viene crudo ("Rnd: 4 (2") y no dice la fase, así
      // que no se muestra. La division tampoco viene en esa fuente.
    });
  });
  return out.sort(function (a, b) { return (b.fecha || 0) - (a.fecha || 0); });
}

  'Intermedia': 'nivel intermedio',
  'Principiantes': 'quienes recién empiezan',
  'Junior Multibote': 'los más chicos: la pelota puede picar más de una vez'
};
const ORDEN_CAT = ['Open', 'Damas', 'Dobles', 'Intermedia', 'Principiantes',
  'Junior A', 'Junior B', 'Junior C', 'Junior Damas', 'Junior Multibote'];
function nombreCat(label) { return NOMBRE_CAT[label] || label; }
function ordenCat(label) {
  const i = ORDEN_CAT.indexOf(nombreCat(label));
  return i < 0 ? 99 : i;
}
function esJunior(label) { return /junior/i.test(nombreCat(label)); }
function categoriasRk() {
  return ((RK && RK.categorias) || []).slice().sort(function (a, b) { return ordenCat(a.label) - ordenCat(b.label); });
}
function filaRk(p, C) {
  const reg = porNombre(p.nombre);
  const b = el('button', 'li' + (p.puesto <= 3 && p.pts > 0 ? ' top' : ''));
  // Quien no sumó puntos no tiene puesto: marcar 37 personas como "61º=" no dice nada.
  b.appendChild(el('span', 'pos', p.pts > 0 ? (p.puesto + 'º' + (p.empatado ? '=' : '')) : '—'));
  const nm = el('span', 'nm');
  nm.appendChild(nodoJugadores([{ uid: reg && reg.uid, name: p.nombre }], p.nombre));
  if (p.ciudad) nm.appendChild(el('small', null, esc(p.ciudad)));
  b.appendChild(nm);
  b.appendChild(el('span', 'pts', String(p.pts)));
  // Tocar cualquier parte de la fila lleva al perfil, no solo el nombre.
  if (reg && reg.uid) b.onclick = function () { ir({ vista: 'jugador', uid: reg.uid }); };
  return b;
}
function vRanking(app) {
  if (!RK) { app.appendChild(el('h1', null, 'Ranking')); app.appendChild(el('div', 'nota', 'Cargando…')); return; }

  // ---- una categoría completa ----
  if (RUTA.cat) {
    const C = categoriasRk().find(function (c) { return c.key === RUTA.cat; });
    if (!C) { app.appendChild(el('div', 'vacio', 'No encontramos esa categoría.')); return; }
    app.appendChild(el('h1', null, nombreCat(C.label)));
    const expl = EXPLICA_CAT[nombreCat(C.label)];
    app.appendChild(el('div', 'sub', [expl, C.total + ' jugadores', C.conPuntos + ' con puntos'].filter(Boolean).join(' · ')));
    const lista = el('div', 'lista');
    C.jugadores.forEach(function (p) { lista.appendChild(filaRk(p, C)); });
    app.appendChild(lista);
    if (C.desordenEnPdf) app.appendChild(el('div', 'aviso', 'En el documento oficial esta categoría venía sin reordenar: los puestos de acá se recalcularon desde los puntos.'));
    if ((C.duplicados || []).length) app.appendChild(el('div', 'aviso', 'El documento repetía a ' + C.duplicados.map(function (d) { return d.nombre; }).join(', ') + '. Se usó la fila con puntos.'));
    app.appendChild(el('div', 'nota', RK.desempate));
    return;
  }

  // ---- índice: top 5 de cada categoría ----
  app.appendChild(el('h1', null, 'Ranking'));
  app.appendChild(el('div', 'sub', 'Federación Chilena de Racquetball · corte ' + RK.corte.etiqueta));

  let bloque = '';
  categoriasRk().forEach(function (C) {
    const b = esJunior(C.label) ? 'Junior' : 'Adultos';
    if (b !== bloque) { bloque = b; app.appendChild(el('h2', null, b)); }
    const caja = el('div', 'catbox');
    const cab = el('div', 'catbox-cab');
    cab.appendChild(el('b', null, esc(nombreCat(C.label))));
    cab.appendChild(el('span', null, 'ver los ' + C.total + ' ›'));
    caja.appendChild(cab);
    const expl = EXPLICA_CAT[nombreCat(C.label)];
    if (expl) caja.appendChild(el('div', 'catbox-vacio', expl));
    const lista = el('div');
    C.jugadores.slice(0, 5).forEach(function (p) {
      const reg = porNombre(p.nombre);
      const f = el('div', 'podio' + (p.puesto === 1 ? ' uno' : ''));
      f.appendChild(el('i', null, p.puesto + 'º'));
      const nb = el('b'); nb.appendChild(nodoJugadores([{ uid: reg && reg.uid, name: p.nombre }], p.nombre));
      f.appendChild(nb);
      f.appendChild(el('span', null, String(p.pts)));
      lista.appendChild(f);
    });
    caja.appendChild(lista);
    const ver = el('button', 'btn', 'Ver la tabla completa');
    ver.style.marginTop = '10px';
    ver.onclick = function () { ir({ vista: 'ranking', cat: C.key }); };
    caja.appendChild(ver);
    app.appendChild(caja);
  });
  app.appendChild(el('div', 'nota', 'Los puntos y los puestos son los del documento oficial. Nada de esto lo calcula la web. ' + RK.desempate));
}

/* ---------- pie ---------- */
function pintarPie() {
  const p = $('#pie'); p.innerHTML = '';
  const activo = torneoActivo();
  p.appendChild(el('div', null,
    'Resultados y horarios: <a href="https://www.r2sports.com/" target="_blank" rel="noopener">r2sports.com</a>, la plataforma oficial de los torneos. ' +
    'Ranking: documento oficial de la Federación Chilena de Racquetball' + (RK && RK.corte ? ', corte <b>' + esc(RK.corte.etiqueta) + '</b>' : '') + '.'));
  p.appendChild(el('div', null,
    'Con torneo en curso los datos se revisan <b>cada 10 a 15 minutos</b> entre las 9 y las 23 horas. Sin torneo, <b>una vez por semana</b>. ' +
    (activo ? 'Los horarios los publica la organización y pueden cambiar sin aviso.' : '')));
  // La hora de la última bajada de datos. Se toma la más nueva entre el catálogo
  // (lo que revisa el bot cada 10-15 min) y el torneo que se está mirando.
  const cuando = [CAT && CAT.updatedAt, T && T.updatedAt]
    .filter(Boolean).sort().pop();
  const texto = cuando && fechaHora(cuando);
  if (texto) p.appendChild(el('div', 'act', 'Última actualización: <b>' + esc(texto) + '</b> · ' + esc(haceCuanto(cuando))));
}

/* ---------- analítica ---------- */
// Solo para saber si la gente entra y cuánto se queda. Umami Cloud: sin cookies,
// sin IP guardada, sin saber quién es nadie, así que no hace falta banner de
// consentimiento. Mientras UMAMI_ID esté vacío no se carga ningún script externo:
// la web sigue siendo cero dependencias.
//
// Para encenderla: crear la cuenta gratis en umami.is, agregar el sitio
// (fabmarti15.github.io) y pegar acá el "Website ID" que da el panel.
const UMAMI_ID = '';
let ultimaVista = '';
function analiticaIniciar() {
  if (!UMAMI_ID) return;
  const s = document.createElement('script');
  s.defer = true;
  s.src = 'https://cloud.umami.is/script.js';
  s.setAttribute('data-website-id', UMAMI_ID);
  // La app navega por hash y Umami no cuenta eso solo: cada vista la avisa pintar().
  s.setAttribute('data-auto-track', 'false');
  s.onload = analiticaVista;
  document.head.appendChild(s);
}
function analiticaVista() {
  if (!UMAMI_ID || !window.umami) return;
  const url = location.pathname + (location.hash || '#/');
  if (url === ultimaVista) return;
  ultimaVista = url;
  // Un fallo de red o un bloqueador no pueden romper la página.
  try {
    window.umami.track(function (p) { return Object.assign({}, p, { url: url }); });
  } catch (e) { /* da igual */ }
}

/* ---------- render ---------- */
function pintar() {
  pintarTabs(); pintarHeader();
  const app = $('#app'); app.innerHTML = '';
  ({ inicio: vInicio, campeonatos: vCampeonatos, campeonato: vCampeonato, jugadores: vJugadores, jugador: vJugador, ranking: vRanking }[RUTA.vista] || vInicio)(app);
  pintarPie();
  analiticaVista();
}

/* ---------- carga ---------- */
const cache = {};
const cacheHora = {};
// GitHub Pages cachea 10 minutos y sirve desde varios nodos, así que dos recargas
// pueden dar versiones distintas. Los datos se piden siempre con un parámetro
// distinto para saltarse la caché, y lo que ya está en memoria vence a los 2 min.
const VENCE_MS = 120000;
async function json(url) {
  try {
    const r = await fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}
// Devuelve el torneo PEDIDO o null. Antes, si la lectura fallaba, dejaba el
// torneo anterior en T y la portada pintaba el podio de otra fecha bajo el
// título equivocado: la Segunda Fecha mostraba los campeones del Nacional Junior.
async function cargarTorneo(tid, forzar) {
  if (!tid) return null;
  // Una fecha terminada no vuelve a cambiar: se guarda para siempre en memoria.
  // Solo el torneo en curso vence, para ver los resultados nuevos.
  const guardado = cache[tid];
  const enCurso = guardado && estadoDe({ startDate: (guardado.tournament || {}).startDate, endDate: (guardado.tournament || {}).endDate, counts: guardado.counts }) === 'in-progress';
  const fresco = guardado && (!enCurso || Date.now() - (cacheHora[tid] || 0) < VENCE_MS);
  if (fresco && !forzar) return guardado;
  if (window.RQ_DATA && String(window.RQ_DATA.tid) === String(tid)) { cache[tid] = window.RQ_DATA; return cache[tid]; }
  const j = await json('./data/' + tid + '.json');
  if (j && j.tournament && String(j.tid) === String(tid)) { cache[tid] = j; cacheHora[tid] = Date.now(); return j; }
  return cache[tid] || null;
}
// T es el torneo que se está mirando. Se fija aparte de la carga para que un
// error de red no cambie de torneo sin avisar.
async function abrirTorneo(tid, forzar) {
  const t = await cargarTorneo(tid, forzar);
  if (t && String(t.tid) === String(tid)) T = t;
  return t;
}
// Si en el servidor hay una versión distinta del programa, avisar en vez de dejar
// al navegador con código viejo por hasta 10 minutos.
async function revisarVersion() {
  const mia = document.documentElement.getAttribute('data-v');
  if (!mia || window.RQ_DATA) return;
  try {
    const r = await fetch('./index.html?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const txt = await r.text();
    const m = txt.match(/data-v="([^"]+)"/);
    if (m && m[1] !== mia && !$('#nueva-version')) {
      const p = el('button', 'aviso'); p.id = 'nueva-version';
      p.style.width = '100%'; p.style.textAlign = 'left';
      p.textContent = 'Hay una versión nueva de la página. Toca acá para recargar.';
      p.onclick = function () { location.reload(); };
      // Fuera de #app: ahí lo borraba el siguiente repintado.
      $('#avisos').appendChild(p);
    }
  } catch (e) { /* sin conexión: no molestar */ }
}
async function arrancar() {
  analiticaIniciar();
  RUTA = leerHash();
  if (window.RQ_DATA) {
    CAT = window.RQ_CAT || null; JUG = window.RQ_JUG || null; RK = window.RQ_RK || null;
    HIST = window.RQ_HIST || null; TNOM = window.RQ_TNOM || null;
    T = window.RQ_DATA; cache[T.tid] = T;
    pintar();
    return;
  }
  const [cat, rk] = await Promise.all([json('./data/index.json'), json('./data/ranking-oficial.json')]);
  CAT = cat; RK = rk;
  pintar();
  // Se abre primero la fecha con agenda: si hay una en curso, esa; si no, la que
  // está por empezar. Con la fecha vieja cargada, el perfil de un jugador no
  // podía mostrarle sus próximos partidos.
  const porVenir = catalogo().filter(function (x) { return x.estado === 'upcoming'; });
  const objetivo = RUTA.tid || (torneoActivo() || {}).tid ||
    (porVenir.length ? porVenir[porVenir.length - 1].tid : '') || (ultimoJugado() || {}).tid;
  // El histórico se pide junto con el resto: si se dejaba para el final, el perfil
  // alcanzaba a mostrar "cargando su carrera".
  const [ju, hi, no] = await Promise.all([
    json('./data/jugadores-circuito.json'),
    json('./data/historico.json'),
    json('./data/torneos-nombres.json'),
    abrirTorneo(objetivo)
  ]);
  JUG = ju; HIST = hi; TNOM = no;
  pintar();
  precargarFechas();
}
// Con la pantalla ya dibujada, se bajan calladas el resto de las fechas (unos
// 700 KB entre todas) para que abrir un campeonato viejo sea instantáneo y no
// muestre "cargando". De a una, para no pelear con lo que el usuario esté viendo.
async function precargarFechas() {
  if (window.RQ_TORNEOS || window.RQ_DATA) return;
  const pendientes = catalogo().map(function (t) { return t.tid; }).filter(function (tid) { return !cache[tid]; });
  let nuevas = false;
  for (const tid of pendientes) {
    await new Promise(function (r) { setTimeout(r, 400); });
    const t = await cargarTorneo(tid);
    if (t && (t.schedule || []).length) nuevas = true;
  }
  // El perfil de un jugador arma su "Por jugar" con las fechas que estén en
  // memoria: si llegaron después de dibujar, hay que volver a pintar.
  if (nuevas && (RUTA.vista === 'jugador' || RUTA.vista === 'inicio')) pintar();
}

window.addEventListener('popstate', function () { RUTA = leerHash(); RONDA = 0; CUADRO = false; if (RUTA.tid) abrirTorneo(RUTA.tid).then(pintar); else pintar(); });
window.addEventListener('hashchange', function () {
  const nueva = leerHash();
  if (JSON.stringify(nueva) === JSON.stringify(RUTA)) return;
  RUTA = nueva; RONDA = 0; CUADRO = false;
  if (RUTA.tid) abrirTorneo(RUTA.tid).then(pintar); else pintar();
});
arrancar();
setInterval(function () {
  if (window.RQ_DATA) return;
  const a = torneoActivo();
  const tid = RUTA.tid || (a && a.tid);
  if (!tid) return;
  abrirTorneo(tid, true).then(pintar);
}, 120000);
setInterval(revisarVersion, 300000);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) return;
  revisarVersion();
  const a = torneoActivo();
  const tid = RUTA.tid || (a && a.tid);
  if (tid) abrirTorneo(tid, true).then(pintar);
});
</script>
